version: 2

updates:
  # Dependências Node.js (npm)
  - package-ecosystem: "npm"
    directory: "/"          # raiz do repositório (ajuste depois para monorepo)
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "security"

  # Dependências GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"
