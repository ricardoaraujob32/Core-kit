name: ci-min

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      # Formatação (se existir script nos workspaces)
      - name: Format check
        run: npm --workspaces --if-present run format:check

      # Lint (idem)
      - name: Lint
        run: npm --workspaces --if-present run lint

      # Typecheck (pega esses erros do TS)
      - name: Typecheck
        run: npm --workspaces --if-present run typecheck

      # Build (se houver; se build roda tsc, ele também pega erro de tipos)
      - name: Build
        run: npm --workspaces --if-present run build

      # Testes unitários
      - name: Unit tests
        run: npm --workspaces --if-present run test
