name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate --schema apps/api/prisma/schema.prisma

      - name: Core typecheck
        run: pnpm -C packages/core exec tsc --noEmit

      - name: API typecheck
        run: pnpm -C apps/api exec tsc --noEmit

      - name: Web typecheck
        run: pnpm -C apps/web exec tsc --noEmit

      - name: Unit tests
        run: pnpm test:unit

  api:
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate --schema apps/api/prisma/schema.prisma

      - name: API tests
        run: pnpm -C apps/api exec vitest run

  build:
    runs-on: ubuntu-latest
    needs:
      - unit
      - api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate --schema apps/api/prisma/schema.prisma

      - name: Build web
        run: pnpm -C apps/web exec vite build