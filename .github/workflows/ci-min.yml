name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Core typecheck
        run: pnpm -C packages/core exec tsc --noEmit

      - name: Core tests
        run: pnpm -C packages/core exec vitest run

  api:
    runs-on: ubuntu-latest
    needs: core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: API typecheck
        run: pnpm -C apps/api exec tsc --noEmit

      - name: API tests
        run: pnpm -C apps/api exec vitest run