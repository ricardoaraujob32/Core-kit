name: ci-min

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (root)
        run: npm ci

      # ✅ roda em todos os workspaces, mas não falha se algum não tiver o script
      - name: Format check
        run: npm -ws --if-present run format:check

      - name: Lint
        run: npm -ws --if-present run lint

      - name: Build
        run: npm -ws --if-present run build

      - name: Typecheck
        run: npm -ws --if-present run typecheck


      - name: Unit tests
        run: npm -ws --if-present run test
