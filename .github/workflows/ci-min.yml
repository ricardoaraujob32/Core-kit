name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      # Opcional: se você tiver script format:check no root
      - name: Format check
        run: npm run -s format:check
        continue-on-error: false

      # Opcional: se você tiver script lint no root
      - name: Lint
        run: npm run -s lint
        continue-on-error: false

      # Roda em todos os workspaces que tiverem o script
      - name: Typecheck (workspaces)
        run: npm run -ws --if-present typecheck

      - name: Unit tests (workspaces)
        run: npm run -ws --if-present test

      - name: Build (workspaces)
        run: npm run -ws --if-present build
