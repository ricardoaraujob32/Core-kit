services:
  postgres:
    image: postgres:16
    container_name: corekit-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: teste
      POSTGRES_USER: teste
      POSTGRES_PASSWORD: teste

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    mem_limit: 768m
    cpus: 1.0

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teste -d teste"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
