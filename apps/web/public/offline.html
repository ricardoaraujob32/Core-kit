<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Core-kit offline</title>
    <meta name="theme-color" content="#0f172a" />
  </head>

  <body>
    <main style="font-family: system-ui; max-width: 560px; margin: 64px auto; padding: 24px;">
      <h1>Você está offline</h1>
      <p>
        O Core-kit não conseguiu carregar esta página agora.
      </p>
      <p>
        Volte para uma tela já aberta ou tente novamente quando a conexão retornar.
      </p>
      <button type="button" onclick="window.location.reload()">
        Tentar novamente
      </button>
    </main>
  </body>
</html>
