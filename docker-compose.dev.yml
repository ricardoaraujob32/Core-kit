services:
  postgres:
    image: postgres:16
    container_name: corekit-postgres-dev
    restart: unless-stopped

    environment:
      POSTGRES_DB: corekit_dev
      POSTGRES_USER: corekit_dev
      POSTGRES_PASSWORD: corekit_dev

    ports:
      - "5433:5432"

    volumes:
      - corekit_postgres_dev_data:/var/lib/postgresql/data

    mem_limit: 768m
    cpus: 1.0

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corekit_dev -d corekit_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  corekit_postgres_dev_data:
